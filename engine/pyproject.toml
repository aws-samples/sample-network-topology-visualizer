[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "network-topology"
dynamic = ["version"]
description = "다계정·다리전 AWS 네트워크 구성을 읽기 전용으로 수집해 토폴로지 스냅샷을 만든다"
readme = "README.md"
requires-python = ">=3.12"
# 런타임 의존성은 boto3 하나로 유지한다. jsonschema 는 산출물 검증(테스트)의 일이고
# 런타임에 끌어들이면 배포 표면만 커진다. CLI 프레임워크도 쓰지 않는다(argparse 로 충분).
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.13"]

[project.scripts]
nettopo = "nettopo.cli:main"

[tool.hatch.version]
# 산출물의 run.tool_version 과 패키지 버전의 유일한 출처.
path = "src/nettopo/__init__.py"

[tool.hatch.build.targets.wheel]
# src-layout. flat 레이아웃은 리포 루트에서 pytest 를 돌릴 때 설치본이 아니라 소스
# 디렉터리를 임포트해 "설치가 깨졌는데 테스트는 통과"를 만든다.
packages = ["src/nettopo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
