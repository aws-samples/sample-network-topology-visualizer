[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "network-topology"
dynamic = ["version"]
description = "Collects a multi-account, multi-Region AWS network configuration with read-only calls and builds a topology snapshot"
readme = "README.md"
requires-python = ">=3.12"
# The runtime dependencies stay at boto3 alone. Validating the output is the
# tests' job, so pulling jsonschema into the runtime would only enlarge the
# deployment surface. No CLI framework either, since argparse is enough.
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.13"]

[project.scripts]
nettopo = "nettopo.cli:main"

[tool.hatch.version]
# The single source for both the package version and run.tool_version in the
# output.
path = "src/nettopo/__init__.py"

[tool.hatch.build.targets.wheel]
# src-layout. With a flat layout, running pytest from the repository root imports
# the source directory rather than the installed package, which produces "the
# installation is broken and the tests pass".
packages = ["src/nettopo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
